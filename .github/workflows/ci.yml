name: CI - Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build Unreal Engine Project
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Project
        run: |
          # Note: This workflow requires Unreal Engine 5.6 to be installed
          # For self-hosted runners, ensure UE is installed and available in PATH
          # For GitHub-hosted runners, consider using game-ci actions with proper licensing

          # Check if UnrealBuildTool is available
          if (Get-Command "UnrealBuildTool" -ErrorAction SilentlyContinue) {
            Write-Host "Building with UnrealBuildTool..."
            UnrealBuildTool -projectfiles -project="${{ github.workspace }}\my_game.uproject" -game -engine
          } else {
            Write-Host "⚠ UnrealBuildTool not found in PATH"
            Write-Host "This workflow requires Unreal Engine 5.6 to be installed"
            Write-Host "For self-hosted runners: Install UE 5.6 and add to PATH"
            Write-Host "For GitHub-hosted runners: Configure with Epic Games licensing"
          }
        shell: pwsh
        continue-on-error: true

      - name: Run Tests
        run: |
          # Run Unreal Engine automation tests if UnrealEditor-Cmd is available
          if (Get-Command "UnrealEditor-Cmd" -ErrorAction SilentlyContinue) {
            Write-Host "Running automated tests..."
            UnrealEditor-Cmd "${{ github.workspace }}\my_game.uproject" -ExecCmds="Automation RunTests Now" -unattended -nopause -NullRHI -log
          } else {
            Write-Host "⚠ UnrealEditor-Cmd not found in PATH"
            Write-Host "Skipping automated tests"
          }
        shell: pwsh
        continue-on-error: true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            **/*.log
            Saved/Logs/
          retention-days: 7
